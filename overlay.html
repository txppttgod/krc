<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRC · оверлей для трансляции</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<!--
  Оверлей для OBS (Источник → Браузер). Фон прозрачный, размер 1920×1080.
  Параметры адреса:
    ?stage=<id>  — какой этап показывать (по умолчанию идущий сейчас)
    ?pos=top     — плашка сверху (по умолчанию снизу)
    ?api=<адрес> — другой адрес бота (для проверки), ?data=<файл> — данные из файла
-->
<style>
:root{--accent:#e8452c;--text:#ededf0;--muted:#9a9aa5;--panel:rgba(11,11,13,.92);--race:'Russo One',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font:20px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
.bar{position:absolute;left:60px;right:60px;bottom:56px;display:flex;align-items:stretch;gap:0;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));
  transition:opacity .4s,transform .4s}
body.top .bar{bottom:auto;top:56px}
.bar.hide{opacity:0;transform:translateY(20px)}
.logo{width:120px;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--race);font-size:34px;letter-spacing:.02em}
.logo small{font:600 13px/1 system-ui,sans-serif;letter-spacing:.12em;margin-top:6px;opacity:.9}
.main{flex:1;background:var(--panel);display:flex;flex-direction:column}
.flag{height:10px;background:repeating-conic-gradient(#e6e6ea 0 25%,#141417 0 50%) 0 0/10px 10px}
.row{display:flex;align-items:center;padding:16px 26px;gap:22px}
.side{flex:1;display:flex;align-items:center;gap:16px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.num{min-width:84px;height:62px;padding:0 10px;border-radius:5px;background:#ededf0;color:#0b0b0d;border-top:6px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--race);font-size:30px}
.nm{min-width:0}.nm b{display:block;font-family:var(--race);font-weight:400;font-size:40px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{color:var(--muted);font-size:18px}
.side.win .nm b{color:#fff}.side.win .num{background:var(--accent);color:#fff;border-top-color:#fff}
.side.lose{opacity:.45}
.mid{text-align:center;min-width:250px}
.mid .vs{font-family:var(--race);font-size:30px;color:var(--muted)}
.mid .rnd{font-family:var(--race);font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.mid .st{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:3px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:#2a2a32}
.mid .st.live{background:var(--accent);color:#fff}.mid .st.judge{background:#f5b942;color:#141005}
.foot{display:flex;justify-content:space-between;gap:20px;padding:8px 26px 12px;border-top:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:17px}
.foot b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="bar hide" id="bar"></div>
<script>
const Q = new URLSearchParams(location.search);
const BOT_URL = (Q.get('api') || 'https://krc-bot.onrender.com').replace(/\/$/, '');
if (Q.get('pos') === 'top') document.body.classList.add('top');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
function side(p, cls, r) {
  if (!p) return `<div class="side ${r}"><div class="num">—</div><div class="nm"><b>ждём</b><span>&nbsp;</span></div></div>`;
  return `<div class="side ${cls} ${r}"><div class="num">${p.num ? '#' + p.num : esc(p.nick.slice(0, 2).toUpperCase())}</div>
    <div class="nm"><b>${esc(p.nick)}</b><span>${esc(p.club || 'соло')}</span></div></div>`;
}
async function tick() {
  let D;
  try { D = await (await fetch(Q.get('data') || BOT_URL + '/data?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) { return; }
  const st = D.stages.find(s => s.id === Q.get('stage')) || D.stages.find(s => s.state === 'run') || D.stages.filter(s => s.state === 'done').slice(-1)[0];
  const bar = document.getElementById('bar');
  if (!st || !st.matches.length) { bar.classList.add('hide'); return; }
  const real = st.matches.filter(m => !m.bye && m.a && m.b);
  const now = real.find(m => m.judging) || real.find(m => m.live);
  const last = real.filter(m => m.done).sort((a, b) => (b.dt || 0) - (a.dt || 0))[0];
  const m = now || last;
  if (!m) { bar.classList.add('hide'); return; }
  const wa = m.done ? (m.w === 'a' ? 'win' : 'lose') : '', wb = m.done ? (m.w === 'b' ? 'win' : 'lose') : '';
  const status = m.done ? `<span class="st">${m.manual ? 'решение организатора' : 'решено'}</span>` : m.judging ? '<span class="st judge">у судей</span>' : '<span class="st live">едут</span>';
  const done = real.filter(x => x.done).length;
  const next = real.find(x => x.live && x !== m);
  bar.innerHTML = `<div class="logo">KRC<small>LIVE</small></div><div class="main"><div class="flag"></div>
    <div class="row">${side(m.a, wa, '')}<div class="mid"><div class="vs">VS</div><div class="rnd">${esc(m.name)}${m.omt ? ' · OMT ' + m.omt : ''}</div>${status}</div>${side(m.b, wb, 'r')}</div>
    <div class="foot"><span><b>${esc(st.title)}</b> · решено пар ${done} из ${real.length}</span>
      <span>${next ? 'Дальше: <b>' + esc(next.a.nick) + '</b> vs <b>' + esc(next.b.nick) + '</b>' : 'Khinkali Racing Championship'}</span></div></div>`;
  bar.classList.remove('hide');
}
tick();
setInterval(tick, 8000);
</script>
</body>
</html>
